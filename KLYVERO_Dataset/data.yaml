# المسار الرئيسي لمجموعة البيانات
path: D:\KLYVERO_Advanced_YOLO\ultralytics\KLYVERO_Dataset

# مسارات الصور بالنسبة للمسار الرئيسي
train: train/images
val: val/images
test: test/images

# إعدادات النقاط المفصلية (12 نقطة للجسم، 3 قيم: x, y, visibility)
kpt_shape: [12, 3]

# مصفوفة التناظر الأفقي للتدريب (تبديل المفاصل اليمنى واليسرى)
flip_idx: [1, 0, 3, 2, 5, 4, 7, 6, 9, 8, 11, 10]

# تعريف الفئات
nc: 4
names: ['front', 'back', 'side', 'full']

# أسماء المفاصل الـ 12 بالترتيب التشريحي الجديد
kpt_names:
  0:
    - left_shoulder
    - right_shoulder
    - left_elbow
    - right_elbow
    - left_wrist
    - right_wrist
    - left_hip
    - right_hip
    - left_knee
    - right_knee
    - left_ankle
    - right_ankle